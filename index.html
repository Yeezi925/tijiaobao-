// 查找分数
function findScore(table, value, smallerBetter = true) {
    let best = 10;
    for (let [s, thresh] of Object.entries(table)) {
        const score = Number(s);
        if ((smallerBetter && value <= thresh) || (!smallerBetter && value >= thresh)) {
            if (score > best) best = score;
        }
    }
    return best;
}

// 计算所有分数（完整版，记录选考两项详情）
function calculateScores(record) {
    const gender = record.gender;
    const longValue = record.swim || record.longrun || 0;
    const isSwim = !!record.swim;

    // 长跑/游泳
    let long100 = 0;
    if (longValue > 0) {
        const project = isSwim ? '游泳' : (gender === '男' ? '1000米跑' : '800米跑');
        const table = SCORING[project][gender];
        long100 = findScore(table, longValue, true);
    }
    record.long100 = long100;
    record.longContrib = (long100 / 100 * 15).toFixed(1);

    // 球类
    let ball100 = 0;
    let ballContrib = 0;
    if (record.football > 0) ball100 = findScore(SCORING["足球运球"][gender], record.football, true);
    else if (record.basketball > 0) ball100 = findScore(SCORING["篮球运球"][gender], record.basketball, true);
    else if (record.volleyball > 0) ball100 = findScore(SCORING["排球40秒对墙垫球"][gender], record.volleyball, false);
    ballContrib = (ball100 / 100 * 9).toFixed(1);
    record.ballContrib = ballContrib;

    // 选考（记录两项详情）
    let selectContrib = 0;
    const selectedProjects = [];
    const selectItems = [
        {val: record.run50, project: '50米跑', smaller: true},
        {val: record.situp, project: '一分钟仰卧起坐', smaller: false},
        {val: record.ball, project: '掷实心球', smaller: false},
        {val: record.rope, project: '1分钟跳绳', smaller: false},
        {val: record.pullup, project: gender === '男' ? '引体向上' : '斜身引体', smaller: false},
        {val: record.jump, project: '立定跳远', smaller: false}
    ];
    const validSelect = selectItems.filter(item => item.val > 0)
        .map(item => ({ ...item, score: findScore(SCORING[item.project][gender], item.val, item.smaller) }))
        .sort((a, b) => b.score - a.score);

    validSelect.slice(0, 2).forEach(item => {
        const contrib = (item.score / 100 * 8).toFixed(1);
        selectContrib += parseFloat(contrib);
        selectedProjects.push({ name: item.project, contrib });
    });
    record.selectContrib = selectContrib.toFixed(1);
    record.selectedProjects = selectedProjects; // 保存选考两项详情

    record.total40 = (parseFloat(record.longContrib) + parseFloat(record.ballContrib) + selectContrib).toFixed(1);
    record.status = '已计算';
}


// 导入文件
function importFile() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) {
        document.getElementById('importStatus').textContent = '请先选择文件';
        return;
    }

    const status = document.getElementById('importStatus');
    status.textContent = '正在解析...';
    status.className = 'success';

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            const headers = json[0].map(h => (h || '').toString().trim().toLowerCase());
            const rows = json.slice(1);

            let imported = 0;
            rows.forEach(row => {
                if (row.every(cell => !cell)) return;
                const record = {};
                headers.forEach((h, i) => {
                    const val = row[i] ? row[i].toString().trim() : '';
                    if (h.includes('姓名') || h.includes('name')) record.name = val;
                    if (h.includes('年段') || h.includes('年级'))record.grade = String(val).trim();
                    if (h.includes('班级') || h.includes('class')) record.class = val;
                    if (h.includes('学校') || h.includes('school')) record.school = val;
                    if (h.includes('性别') || h.includes('gender')) record.gender = val.includes('男') ? '男' : '女';
                    if (h.includes('长跑') || h.includes('1000') || h.includes('800')) record.longrun = parseFloat(val) || 0;
                    if (h.includes('游泳') || h.includes('200米')) record.swim = parseFloat(val) || 0;
                    if (h.includes('足球')) record.football = parseFloat(val) || 0;
                    if (h.includes('篮球')) record.basketball = parseFloat(val) || 0;
                    if (h.includes('排球')) record.volleyball = parseFloat(val) || 0;
                    if (h.includes('50米')) record.run50 = parseFloat(val) || 0;
                    if (h.includes('仰卧起坐')) record.situp = parseFloat(val) || 0;
                    if (h.includes('实心球')) record.ball = parseFloat(val) || 0;
                    if (h.includes('跳绳')) record.rope = parseFloat(val) || 0;
                    if (h.includes('引体') || h.includes('斜身')) record.pullup = parseFloat(val) || 0;
                    if (h.includes('立定跳远')) record.jump = parseFloat(val) || 0;
                });

                if (record.name && record.gender) {
                    calculateScores(record);
                    scores.push(record);
                    imported++;
                }
            });

            if (imported > 0) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
                document.getElementById('recordCount').textContent = scores.length;
                status.textContent = `成功导入并计算 ${imported} 条成绩！`;
                status.className = 'success';
            } else {
                status.textContent = '没有找到有效记录，请检查表格是否有姓名和性别';
                status.className = 'error';
            }
        } catch (err) {
            status.textContent = '导入失败：' + err.message;
            status.className = 'error';
            console.error(err);
        }
    };
    reader.readAsArrayBuffer(file);
}

// 查询显示完整成绩（优化：显示选考两项）
function searchScores() {
    const key = document.getElementById('searchKey').value.trim().toLowerCase();
    const filtered = scores.filter(s => 
        (s.name && s.name.toLowerCase().includes(key)) || 
        (s.class && s.class.toLowerCase().includes(key))
    );

    const tableDiv = document.getElementById('resultTable');
    tableDiv.innerHTML = '';
    if (filtered.length === 0) {
        tableDiv.innerHTML = '<p style="text-align:center; color:#999;">没有找到匹配的记录</p>';
        return;
    }

    let html = `
    <table>
        <thead>
            <tr>
                <th>姓名</th>
                <th>班级</th>
                <th>性别</th>
                <th>总分 (40)</th>
                <th>长跑/游泳 (15)</th>
                <th>球类 (9)</th>
                <th>选考1</th>
                <th>选考2</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody>
    `;

    filtered.forEach(s => {
        const proj1 = s.selectedProjects?.[0] || {name: '-', contrib: '-'};
        const proj2 = s.selectedProjects?.[1] || {name: '-', contrib: '-'};
        html += `
            <tr>
                <td>${s.name || '-'}</td>
                <td>${s.class || '-'}</td>
                <td>${s.gender || '-'}</td>
                <td>${s.total40 || '-'}</td>
                <td>${s.longContrib || '-'}</td>
                <td>${s.ballContrib || '-'}</td>
                <td>${proj1.name}: ${proj1.contrib || '-'}</td>
                <td>${proj2.name}: ${proj2.contrib || '-'}</td>
                <td>${s.status || '已导入'}</td>
            </tr>
        `;
    });

    html += '</tbody></table>';
    tableDiv.innerHTML = html;
}

function singleProjectStats(data){
    function calc40(field, project, weight, smaller=true){
        const valid = data.filter(s => parseFloat(s[field]) > 0);
        if(valid.length===0){
            return {count:0,avg:'0.00'};
        }
        const arr = valid.map(s=>{
            const val=parseFloat(s[field])||0;
            const gender=s.gender;
            const table=SCORING[project][gender];
            const score100=findScore(table,val,smaller);
            return score100/100*weight;
        });
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        return {count:valid.length,avg:avg.toFixed(2)};
    }

    // ⭐ 球类单独处理（3选1）
    function calcFootball(){
        const valid=data.filter(s=>parseFloat(s.football)>0);
        if(valid.length===0){
            return {count:0,avg:'0.00'};
        }
        const arr=valid.map(s=>{
            const score100=findScore(
                SCORING["足球运球"][s.gender],
                s.football,
                true
            );
            return score100/100*9;
        });
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        return {count:valid.length,avg:avg.toFixed(2)};
    }

    function calcBasketball(){
        const valid=data.filter(s=>parseFloat(s.basketball)>0);
        if(valid.length===0){
            return {count:0,avg:'0.00'};
        }
        const arr=valid.map(s=>{
            const score100=findScore(
                SCORING["篮球运球"][s.gender],
                s.basketball,
                true
            );
            return score100/100*9;
        });
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        return {count:valid.length,avg:avg.toFixed(2)};
    }

    function calcVolleyball(){
        const valid=data.filter(s=>parseFloat(s.volleyball)>0);
        if(valid.length===0){
            return {count:0,avg:'0.00'};
        }
        const arr=valid.map(s=>{
            const score100=findScore(
                SCORING["排球40秒对墙垫球"][s.gender],
                s.volleyball,
                false
            );
            return score100/100*9;
        });
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        return {count:valid.length,avg:avg.toFixed(2)};
    }

    // ⭐ 长跑
    function calcLong(){
        const valid=data.filter(s=>s.longrun>0);
        if(valid.length===0){
            return {count:0,avg:'0.00'};
        }
        const arr=valid.map(s=>{
            const project=s.gender==='男'?'1000米跑':'800米跑';
            const score100=findScore(
                SCORING[project][s.gender],
                s.longrun,
                true
            );
            return score100/100*15;
        });
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        return {count:valid.length,avg:avg.toFixed(2)};
    }

    // ⭐ 游泳
    function calcSwim(){
        const valid=data.filter(s=>s.swim>0);
        if(valid.length===0){
            return {count:0,avg:'0.00'};
        }
        const arr=valid.map(s=>{
            const score100=findScore(
                SCORING["游泳"][s.gender],
                s.swim,
                true
            );
            return score100/100*15;
        });
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        return {count:valid.length,avg:avg.toFixed(2)};
    }

    return{
        "50米跑":calc40('run50','50米跑',8,true),
        "仰卧起坐": calc40('situp','一分钟仰卧起坐',8,false),
        "实心球": calc40('ball','掷实心球',8,false),
        "跳绳": calc40('rope','1分钟跳绳',8,false),
        "引体类": calc40('pullup','引体向上',8,false),
        "立定跳远": calc40('jump','立定跳远',8,false),
        "长跑":calcLong(),
        "游泳":calcSwim(),
        "足球":calcFootball(),
        "篮球":calcBasketball(),
        "排球":calcVolleyball()
    };
}
function calcStats(data){

    const total = data.length;

    const avgTotal = (
        data.map(s => parseFloat(s.total40) || 0)
        .reduce((a,b)=>a+b,0) / total
    ).toFixed(1);

    const pass = data.filter(s => parseFloat(s.total40) >= 24).length;

    return {
        total,
        avgTotal,
        passRate: ((pass/total)*100).toFixed(1) + "%"
    };
}

    const level = document.getElementById('analyzeLevel').value;
    const keyword = document.getElementById('analyzeKeyword').value.trim();
    const showGender = document.getElementById('showGenderCompare').checked;

    if (level !== 'school' && !keyword) {
        document.getElementById('analyzeResult').innerHTML = '<p style="color:red;">请输入关键词</p>';
        return;
    }

    let filtered = scores;
    if(level==="year"){
        filtered = filtered.filter(s=>
            String(s.grade||s["年段"]||"")
            .toLowerCase()
            .includes(keyword)
        );

            String(s.class||"").trim() === keyword

// 单人生成AI建议
async function generateAdvice(){
  // 找到用户选中的行
  const selRow = document.querySelector("#resultTable tr.selected");
  if(!selRow){
    alert("请先点击表格中某个学生行以选中");
    return;
  }

  // 构造学生对象
  const student = {
    name: selRow.cells[0].textContent,
    class: selRow.cells[1].textContent,
    gender: selRow.cells[2].textContent,
    total40: selRow.cells[3].textContent,
    longContrib: selRow.cells[4]?.textContent,
    ballContrib: selRow.cells[5]?.textContent,
    // 如果你有选考项目可以加上 selectedProjects 字段
  };

  const res = await fetch("/api/suggest", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ student })
  });

  const data = await res.json();
  document.getElementById("aiResult").textContent = data.advice || "生成失败";
}

// 点击表格行高亮选中
document.getElementById("resultTable").addEventListener("click", e=>{
  const tr = e.target.closest("tr");
  if(!tr || tr.parentNode.tagName==="THEAD") return;
  document.querySelectorAll("#resultTable tr").forEach(r=>r.classList.remove("selected"));
  tr.classList.add("selected");
});
// 计算统计
function calcStats(group) {
    if (!group || group.length === 0) return null;
    const totals = group.map(s => parseFloat(s.total40) || 0);
    return {
        count: group.length,
        avgTotal: (totals.reduce((a,b)=>a+b,0)/group.length).toFixed(1),
        excellentRate: ((totals.filter(v=>v>=36).length/group.length)*100).toFixed(1)+'%',
        passRate: ((totals.filter(v=>v>=30).length/group.length)*100).toFixed(1)+'%',
        lowRate: ((totals.filter(v=>v<20).length/group.length)*100).toFixed(1)+'%',
        fullScoreCount: totals.filter(v=>v==40).length,
        avgLong: (group.map(s=>parseFloat(s.longContrib)||0)
            .reduce((a,b)=>a+b,0)/group.length).toFixed(1),
        avgBall: (group.map(s=>parseFloat(s.ballContrib)||0)
            .reduce((a,b)=>a+b,0)/group.length).toFixed(1),
        avgSelect: (group.map(s=>parseFloat(s.selectContrib)||0)
            .reduce((a,b)=>a+b,0)/group.length).toFixed(1)
    };
}

function downloadFile() {
    if (!scores || scores.length === 0) {
        alert('没有可导出的成绩');
        return;
    }

    const exportData = scores.map(s => {
        const proj1 = s.selectedProjects?.[0] || {};
        const proj2 = s.selectedProjects?.[1] || {};
        return {
            姓名: s.name || '',
            班级: s.class || '',
            学校: s.school || '',
            性别: s.gender || '',
            总分40: s.total40 || '',
            长跑游泳得分: s.longContrib || '',
            球类得分: s.ballContrib || '',
            选考总得分: s.selectContrib || '',
            选考1项目: proj1.name || '',
            选考1得分: proj1.contrib || '',
            选考2项目: proj2.name || '',
            选考2得分: proj2.contrib || '',
            状态: s.status || ''
        };
    });

    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "成绩报告");
    const wbout = XLSX.write(wb,{ bookType:'xlsx', type:'array' });
    const blob = new Blob([wbout],{ type:"application/octet-stream" });
    const link=document.createElement("a");
    link.href=URL.createObjectURL(blob);
    link.download="体教宝成绩报告.xlsx";
    link.click();
}
function generateAdvice(){

    if(scores.length === 0){
        alert("没有学生数据");
        return;
    }

    const student = scores[0];

    fetch("/api/suggest",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({student})
    })
    .then(res=>res.json())
    .then(data=>{
        document.getElementById("aiResult").textContent =
            data.advice || JSON.stringify(data);
    })
    .catch(err=>{
        console.error(err);
        alert("AI请求失败");
    });
}
